; qmllint settings for the media widget plugin.
;
; Import paths are handled by tests/lint.sh, which builds a temporary
; `qs/Commons`, `qs/Ui` layout so qmllint can resolve the Omarchy shell
; modules (they live in a plain directory layout the dot-URI import cannot
; map directly).
;
; A few warning classes are known cosmetic noise shared with the Omarchy
; shell's own plugins when linted against the shipped Quickshell qmltypes:
; unresolved PanelWindow members (marked uncreatable there), Color.menu.* /
; Color.tooltip.* through QtObject-typed properties, DragHandler's
; pressedChanged (base-class signal), and QProcess::ExitStatus in
; Quickshell.Io. They stay enabled so genuinely new warnings are visible.

[General]
MaxWarnings=-1

[Warnings]
MissingProperty=warning
IncompatibleType=warning
SignalHandlerParameters=warning
Unqualified=warning